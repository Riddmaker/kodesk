# Lint, tests, nix build and the headless GUI check (CLAUDE.md "Standard CI/CD" step 3).
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ruff, pylint, mypy, pytest, nix build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - name: Linters and tests
        run: nix develop -c tools/check.sh
      - name: Nix package (runs the test suite again inside the build)
        run: nix build .#kodesk -L
      - name: Headless GUI check (sway + wtype + grim)
        run: nix develop -c tools/gui-smoke.sh gui-smoke result/bin/kodesk
      - name: Upload GUI screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-smoke
          path: gui-smoke/
          if-no-files-found: ignore
