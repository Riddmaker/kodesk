[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kodesk"
version = "0.1.0.dev0"
description = "Desktop companion for KOReader e-readers: update, extend and tune them without breaking your setup"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Riddmaker" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = ["PySide6>=6.8"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "ruff", "pylint", "mypy"]

[project.scripts]
kodesk = "kodesk.ui.app:main"

[project.urls]
Homepage = "https://github.com/Riddmaker/kodesk"

[tool.hatch.build.targets.wheel]
packages = ["src/kodesk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "S", "PTH"]
ignore = ["S101"]  # asserts are fine in tests; production code does not rely on them
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"src/kodesk/ui/**" = ["N802", "N815"]  # Qt overrides and signals use camelCase

[tool.pylint.main]
py-version = "3.12"
extension-pkg-allow-list = ["PySide6"]

[tool.pylint.basic]
# Short, self-explaining functions and tests need no docstring; longer ones do.
no-docstring-rgx = "^(_|test_)"
docstring-min-length = 8

[tool.pylint.design]
max-attributes = 15  # frozen dataclasses mirror KOReader's settings records
max-locals = 20  # layout and render functions are straight-line mappings of named values

[tool.pylint.typecheck]
generated-members = [".*\\.connect", ".*\\.emit"]  # Qt signals are created at runtime

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "too-few-public-methods",   # Qt widgets and dataclasses legitimately have few methods
    "invalid-name",             # Qt overrides use camelCase (paintEvent, mousePressEvent)
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["kodesk"]

[[tool.mypy.overrides]]
module = ["pytestqt.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_calls = false  # pytest-qt's QtBot is only partly annotated

[[tool.mypy.overrides]]
# Upstream's generated Qt stubs are not our code (the nix dev shell puts them on MYPYPATH).
module = ["PySide6.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"
markers = ["gui: needs a Qt platform (offscreen is fine)"]
filterwarnings = ["error"]
